[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kitti-object-detection" 
version = "0.1.0"
description = "End-to-end 2D object classification, detection, and tracking on the KITTI dataset."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "Pillow",
    "opencv-python",
    "pyyaml",
    "scipy",
    "pytest"
]

[tool.setuptools.packages.find]
where = ["src"]
 